# 香港电影聚合站 · 图片子域配置（灰云 / 仅 DNS）
#
# ★ 本文件解决的问题（2026-09-19 实测）：
#
#   本站 HTML/JS 走 Cloudflare（橙云）没问题 —— 首页压缩后仅 7KB。
#   但**海报走 CF 会明显变慢**：CF 免费版没有大陆节点，把大陆用户导到
#   西雅图，而源站在香港。实测 16 张海报全部加载完（6 并发，即真实浏览器）：
#
#     经 CF（主域）   1.05–1.46s   吞吐 23–75KB/s
#     直连香港        0.18–0.47s   吞吐 157–253KB/s   → 快 2.3–5.8 倍
#
#   对照：hkmovie6 的海报秒开，因为它在 Amazon S3 ap-east-1（香港），
#   走香港节点，不经过 CF。
#
# ★ 做法：另开 img 子域并设为**灰云**（CF 面板里云朵图标点成灰色 =
#   仅 DNS，流量不经 CF），指向香港源站。这样：
#     - 海报走香港直连（快 2.3–5.8 倍）
#     - HTML/JS 仍走主域（保留 CF 的 DDoS/WAF 防护）
#
# ★ 与主域配置（nginx-static.conf）的分工：
#   本文件**只服务 /posters/**，其余路径一律 404 —— 缩小暴露面。
#   源站 IP 会因灰云而暴露，因此这里只开图片这一条最窄的路。
#
# 部署位置：宿主机 /home/web/conf.d/img.<域名>.conf
# 证书：/home/web/certs/img.<域名>_cert.pem（由 /root/auto_cert_renewal.sh
#   自动续期 —— 该脚本遍历 certs/*_cert.pem 并按同名 .conf 查找 letsencrypt
#   关键字，因此下面的 ACME location 不可删）

server {
    listen 80;
    listen [::]:80;
    server_name __IMG_DOMAIN__;

    # ★ ACME HTTP-01 验证必须走 80 端口明文。
    #   证书续期脚本用 certbot --webroot 指向 /var/www/letsencrypt，
    #   删掉这段会导致证书到期后无法自动续签。
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }

    # 其余一律跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;

    server_name __IMG_DOMAIN__;

    ssl_certificate     /etc/nginx/certs/__IMG_DOMAIN___cert.pem;
    ssl_certificate_key /etc/nginx/certs/__IMG_DOMAIN___key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_hkmovie:10m;
    ssl_session_timeout 1d;

    # 图片是跨域引用（页面在主域，图片在此子域），但不能加宽松 CORS：
    # <img> 标签加载图片**不需要** CORS，加了反而扩大攻击面。
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Content-Type-Options "nosniff" always;
    # 图片允许被任何站点引用（本站是聚合站，可能有外部链接引用海报）
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    root /var/www/html;

    # ★ 只服务海报目录。其余路径（含 /、/movie/、/_next/）一律 404。
    #   灰云会暴露源站 IP，把可访问面压到最小是必要的防御。
    location /posters/ {
        # 文件名 = 原始 URL 的 sha1 前 16 位，内容变则文件名变 → 可永久缓存
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        access_log off;
        # 图片已是 WebP，再过 gzip 只白耗 CPU
        gzip off;
        # 图片请求量大且高度重复，文件缓存收益明显
        open_file_cache max=8192 inactive=120s;
        open_file_cache_valid 180s;
        open_file_cache_min_uses 1;
        # 只允许 GET/HEAD，其余方法没有意义
        limit_except GET HEAD {
            deny all;
        }
    }

    # 显式拒绝其余一切（比 default 404 更早、更省资源）
    location / {
        return 404;
    }
}
