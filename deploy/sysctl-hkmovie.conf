# 香港电影聚合站 · 跨境链路内核优化
#
# 部署：sudo cp deploy/sysctl-hkmovie.conf /etc/sysctl.d/99-hkmovie.conf
#       sudo sysctl -p /etc/sysctl.d/99-hkmovie.conf
#
# ★ 为什么需要（2026-09-19 实测）：
#
#   大陆 → 香港链路实测丢包约 10%（30 次 TCP 连接失败 3 次）。
#   默认 net.ipv4.tcp_max_syn_backlog=128 偏小，叠加默认 tcp_syn_retries=6，
#   一次 SYN 丢失要等 1+2+4+8=15 秒才放弃 —— 实测 6 并发 TLS 握手偶发
#   卡满 15.2s（12 轮里 1–3 轮），正是这个退避序列。
#
#   这解释了「海报偶尔慢半拍」：多数请求 0.2s，少数干等 15s。
#   单机直连（本方案）无法完全消除跨境丢包，但可以缩短最坏等待。
#
# 调整前后（6 并发 TLS，12 轮）：
#   慢(>3s) 3/10 → 1/12
#   中位 0.20s（对比经 CF 的 1.01s，快 5 倍）
net.ipv4.tcp_max_syn_backlog = 4096
net.core.somaxconn = 4096
# 6 → 3：最坏等待从 15s 降到 7s。跨境丢包靠客户端重试比干等更划算。
net.ipv4.tcp_syn_retries = 3
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
