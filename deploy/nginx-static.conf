# 香港电影聚合站 · nginx 站点配置（静态导出版 · 容器）
#
# ★ 本文件对应**线上真实运行的配置**，放置于宿主机 /home/web/conf.d/<域名>.conf，
#   由 nginx 容器（host 网络模式）读取。2026-09-19 之前它只存在于服务器上、
#   从未进仓库 —— 每次改动都靠手改，回滚无据。此处收编入库。
#
# 环境前提：
#   - nginx 容器：net=host，挂载 /home/web/conf.d → /etc/nginx/conf.d
#   - 站点根：/home/web/html → /var/www/html（静态导出产物）
#   - 证书：Cloudflare Origin Certificate 放 /home/web/certs/
#   - 与探针站（komari.yuurei.de）靠 server_name 区分，互不干扰
#
# 历史沿革：2026-09-18 前是反代到 Node 常驻进程（省下约 128MB 内存后改为静态导出）。
#   反代版模板见 nginx-hk-movie.conf（供 setup-vps.sh 新装使用）。
#
# ★ 2026-09-19 新增 /posters/ 缓存段：
#   海报已由 scripts/fetch-posters.mjs 本地化为 400w WebP 放在 /posters/。
#   文件名是「原始 URL 的 sha1 前 16 位」—— 内容变则文件名必变，
#   因此可以安全地给一年 immutable：浏览器与 Cloudflare 边缘都能长期命中。
#   实测：同一 URL 第二次请求 cf-cache-status 即由 MISS 转 HIT。

server {
    listen 80;
    listen [::]:80;
    server_name __SITE_DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;

    server_name __SITE_DOMAIN__;

    ssl_certificate     /etc/nginx/certs/__SITE_DOMAIN___cert.pem;
    ssl_certificate_key /etc/nginx/certs/__SITE_DOMAIN___key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_hkmovie:10m;
    ssl_session_timeout 1d;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/html;
    index index.html;

    client_max_body_size 20m;

    # ---------- Next.js 静态资源（文件名带 hash，可永久缓存）----------
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---------- 本地化海报：内容寻址，可永久缓存 ----------
    # 这是「CDN 节点缓存」真正生效的地方：CF 边缘命中后回源流量接近 0。
    # 同时它也是 mclcinema 不可达问题的解法 —— 用户只访问同源路径。
    location /posters/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        # 图片本身已是压缩格式（WebP），再过 gzip 只白耗 CPU
        gzip off;
        open_file_cache max=4096 inactive=60s;
        open_file_cache_valid 120s;
        open_file_cache_min_uses 1;
    }

    # ---------- ACME 验证 ----------
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }

    # ---------- 静态导出路由 ----------
    # /movie/xxx → /movie/xxx/index.html（next.config.ts 里 trailingSlash: true）
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;
}
